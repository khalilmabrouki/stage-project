    <main class="page-content">

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card h-100">
             <div class="card-header position-relative overflow-hidden">
    <!-- Background admin icon -->
    <i data-lucide="user-cog" class="position-absolute" 
       style="right: 20px; top: 50%; transform: translateY(-50%); width: 120px; height: 120px; color: rgba(102, 126, 234, 0.05); z-index: 0; pointer-events: none;"></i>
    
    <div class="position-relative" style="z-index: 1;">
        <h3 class="header-title">
            <i data-lucide="user-plus" class="me-2" style="width: 28px; height: 28px; color: #667eea; display: inline-block;"></i>
            Ajouter un Administrateur
        </h3>
        <p class="header-subtitle mb-0">Créez un nouveau compte administrateur</p>
    </div>
</div>
              <div class="card-body">
                <form (ngSubmit)="addNewAdmin()" [formGroup]="adminForm" >
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Nom</label>
                    <input formControlName="nom" type="text" class="form-control" id="exampleInputEmail1" placeholder="Entrez votre nom" aria-describedby="emailHelp">

                   
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Prenom</label>
                    <input formControlName="prenom" type="text" class="form-control" id="exampleInputPassword1" placeholder="Entrez votre prenom">
                  </div>
                  <!--email-->
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Email</label>
                    <input formControlName="email" type="email" class="form-control" id="exampleInputPassword1" placeholder="Entrez votre email" >
                  </div>
                  <!--mot de passe-->
                   <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Mot de passe</label>
                    <input formControlName="mdp" type="password" class="form-control" id="exampleInputPassword1" placeholder="Créez un mot de passe sécurisé" >
                  </div>
                   <!-- role -->
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label" >Role</label>

                    <select id="" value="" class="form-control" formControlName="role" >  
                        <option value="superAdmin"  > Super Administrateur </option>
                        <option value="sousAdmin"   >  Sous Administrateur </option>
                    
                    </select>
                    
                  </div>
                  <hr>

           <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary btn-lg px-5" routerLink="/ajouter-admin">
        <i data-lucide="user-plus" class="me-2" style="width: 20px; height: 20px; display: inline-block;"></i>
        Ajouter
    </button>
    <button type="reset" class="btn btn-outline-secondary btn-lg px-5">
        <i data-lucide="x" class="me-2" style="width: 20px; height: 20px; display: inline-block;"></i>
     Annuler
    </button>
</div>              
                </form>

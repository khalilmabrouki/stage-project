<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login  - Tarento Bootstrap Admin & Dashboard Template</title>
  <meta name="description"
    content="Tarento is a fully responsive and premium Bootstrap 5 Admin & Dashboard Template built with HTML, CSS, and JS.">
  <meta name="keywords" content="admin, dashboard, bootstrap 5, template, responsive, web app, ui kit">
  <meta name="author" content="Paitheme">

</head>
<body class="bg-light d-flex align-items-center justify-content-center h-100vh">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card border-0 shadow-lg p-4">
          <div class="card-body">
            <div class="text-center mb-4">
              <h3 class="fw-bold text-primary mb-1">DashLite</h3>
              <p class="text-muted">Welcome back! Please login to your account.</p>
            </div>

            <form>
              <div class="mb-3">
                <label class="form-label fw-medium">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i data-lucide="mail" class="fs-18"></i></span>
                  <input type="email" class="form-control" placeholder="admin@example.com" value="admin@example.com">
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label fw-medium mb-0">Password</label>
                  <a class='text-decoration-none small' href='forgot-password.html'>Forgot password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text">
                    <i data-lucide="lock" class="fs-18"></i></span>
                  <input type="password" class="form-control" placeholder="••••••••" value="password">
                </div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>

              <div class="d-grid mb-4">
                <button type="button" class="btn btn-primary fw-bold" onclick="window.location.href='index.html'">Sign
                  In</button>
              </div>

              <div class="text-center">
                <p class="text-muted mb-0">Don't have an account? <a class='text-decoration-none fw-medium' href='register.html'>Create one</a></p>
              </div>
            </form>
          </div>
        </div>
        <div class="text-center mt-4">
          <p class="text-muted small">&copy; <span id="year"></span> DashLite. All rights reserved.</p>
        </div>
      </div>
    </div>
  </div>


</body>

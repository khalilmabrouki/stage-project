<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- This file has been downloaded from bootdey.com @bootdey on twitter -->
    <!-- Licensed under the Bootdey Content License https://bootdey.com/license -->
    <title>account setting or edit profile - Bootdey.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
</head>
<body>
<div class="container">



<div class="row gutters">
<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 col-12">
<div class="card h-100">
	<div class="card-body">
		<div class="account-settings">
			<div class="user-profile">
				<div class="user-avatar">
					<img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Maxwell Admin">
				</div>
				<h5 class="user-name">Yuki Hayashi</h5>
				<h6 class="user-email"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="8af3ffe1e3cac7ebf2fdefe6e6a4e9e5e7">[email&#160;protected]</a></h6>
			</div>
			<div class="about">
				<h5>About</h5>
				<p>I'm Yuki. Full Stack Designer I enjoy creating user-centric, delightful and human experiences.</p>
			</div>
		</div>
	</div>
</div>
</div>
<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12">
<div class="card h-100">

<form [formGroup]="updateadminForm"  (ngSubmit)="updateadmin()">

	<div class="card-body">
		<div class="row gutters">
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
				<h6 class="mb-2 text-primary">Modifier le Profil</h6>
			</div>
			<div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
				<div class="form-group">
					<label for="fullName">Nom</label>
					<input formControlName="nom"  type="text" class="form-control" id="fullName" placeholder="Entrez votre nom">
				</div>
			</div>
			<div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
				<div class="form-group">
					<label>Prenom</label>
					<input  formControlName="prenom"  type="text" class="form-control" id="" placeholder="Entrez votre Prenom">
				</div>
			</div>
			<div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
				<div class="form-group">
					<label >Email</label>
					<input formControlName="email"  type="email" class="form-control" id="" placeholder="Entrez votre email">
				</div>
			</div>
		
		      <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                                <div class="mb-3">
                                                    <label for="mdp" class="form-label "> Mot de passe</label>
                                                    <input formControlName="mdp"   type="password" class="form-control" id="mdp" placeholder="Entrez un nouveau mot de passe">
                                                </div>
			</div>
			    <!-- Rôle -->
                                        <div class="row gutters mt-3">
                                            <div class="col-xl-12 col-lg-10 col-md-12 col-sm-12 col-12">
                                                <div class="mb-3">
                                                    <label for="role" class="form-label ">Rôle</label>
                                                    <select formControlName="role" [disabled]="!isSuperAdmin" class="form-control" id="role" >
                                                        <option value="" disabled selected>Choisir un rôle</option>
                                                        <option value="superAdmin"> Super Administrateur </option>
                                                        <option value="sousAdmin">Sous Administrateur</option>
                                                    </select>
                                                </div>
                                                <small *ngIf="!isSuperAdmin" class="text-danger">
                Vous n'avez pas le droit de modifier le rôle
                                               </small>
                                            </div>
                                        </div>
		
		
		</div>
		<div class="row gutters" >
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
				<div class="text-right">
					<button type="button" id="submit" name="submit" class="btn btn-secondary">Annuler</button>
					<button type="submit" id="submit" name="submit" class="btn btn-primary">Modfier</button>
				</div>
			</div>
		</div>
	</div>

    </form>
</div>

</div>
</div>

  

</div>
</body>
</html>

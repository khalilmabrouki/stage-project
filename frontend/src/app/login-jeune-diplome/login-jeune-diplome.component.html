<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Connexion | Jeune Diplômé</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content=" " />
    <meta name="keywords" content="" />
    <meta content="Themesdesign" name="author" />
</head>

<body>
    <!-- Begin page -->
    <div>

        <div class="main-content">

            <div class="page-content">

                <!-- START SIGN-IN -->
                <section class="bg-auth">
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-xl-10 col-lg-12">
                                <div class="card auth-box">
                                    <div class="row g-0">
                                        <div class="col-lg-6 text-center">
                                            <div class="card-body p-4">
                                                <a href="index.html">
                                                    <img src="assets/images/logo-light.png" alt="" class="logo-light">
                                                    <img src="assets/images/logo-dark.png" alt="" class="logo-dark">
                                                </a>
                                                <div class="mt-5">
                                                    <img src="assets/images/auth/sign-in.png" alt="" class="img-fluid">
                                                </div>
                                            </div>
                                        </div><!--end col-->
                                        <div class="col-lg-6">
                                            <div class="auth-content card-body p-5 h-100 text-white">
                                                <div class="w-100">
                                                    <div class="text-center mb-4">
                                                        <h5>Bon retour !</h5>
                                                        <p class="text-white-70">Connectez-vous pour continuer sur Jobcy.</p>
                                                    </div>

                                                    <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">

                                                        <div class="mb-3">
                                                            <label for="emailInput" class="form-label">Email</label>
                                                            <input type="email" 
                                                                   class="form-control" 
                                                                   id="emailInput"
                                                                   formControlName="email"
                                                                   placeholder="Entrez votre email" 
                                                                   required>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label for="passwordInput" class="form-label">Mot de passe</label>
                                                            <input type="password" 
                                                                   class="form-control" 
                                                                   id="passwordInput"
                                                                   formControlName="mdp"
                                                                   placeholder="Entrez votre mot de passe" 
                                                                   required>
                                                        </div>

                                                        <div class="mb-4">
                                                            <div class="form-check">
                                                                <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                                                                <a href="reset-password.html" class="float-end text-white">Mot de passe oublié ?</a>
                                                                <label class="form-check-label" for="flexCheckDefault">Se souvenir de moi</label>
                                                            </div>
                                                        </div>

                                                        <div class="text-center">
                                                            <button type="submit" class="btn btn-white btn-hover w-100">
                                                                Se connecter
                                                            </button>
                                                        </div>
                                                    </form>

                                                    <div class="mt-4 text-center">
                                                        <p class="mb-0">Vous n'avez pas de compte ? 
                                                            <a href="#" class="fw-medium text-white text-decoration-underline" (click)="goToRegister()"> S'inscrire </a>
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><!--end col-->
                                    </div><!--end row-->
                                </div><!--end auth-box-->
                            </div><!--end col-->
                        </div><!--end row-->
                    </div><!--end container-->
                </section>
                <!-- END SIGN-IN -->

            </div>
            <!-- End Page-content -->

        </div>
        <!-- end main content-->

    </div>
    <!-- END layout-wrapper -->

</body>

</html>
